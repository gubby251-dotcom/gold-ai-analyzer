
name: SNR SND Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: snr-snd-alerts
  cancel-in-progress: false


jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm init -y
          npm install firebase-admin

      - name: Run SNR SND scanner
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          BIQUOTE_BASE_URL: https://biquote.io/api
        run: node scanner/snr-snd-alerts.mjs

      - name: Save scanner state to repository
        if: always()
        run: |
          if [ -f snr-snd-state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f snr-snd-state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update SNR SND scanner state"
              git push origin HEAD:main
            else
              echo "Scanner state tidak berubah."
            fi
          else
            echo "File snr-snd-state.json belum dibuat."
          fi
