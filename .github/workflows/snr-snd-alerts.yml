
name: SNR SND Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: snr-snd-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm init -y
          npm install firebase-admin

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: snr-snd-state.json
          key: snr-snd-state-${{ github.run_id }}
          restore-keys: |
            snr-snd-state-

      - name: Run SNR SND scanner
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          BIQUOTE_BASE_URL: https://biquote.io/api
        run: node scanner/snr-snd-alerts.mjs

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: snr-snd-state.json
          key: snr-snd-state-${{ github.run_id }}
