
name: Build SEBU DOLLAR ANALYZER APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK tidak ditemukan: $ANDROID_HOME"
            exit 1
          fi
          echo "Android SDK ditemukan."
          ls "$ANDROID_HOME"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/sebudollar/analyzer
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          test -f assets/logo.png || {
            echo "ERROR: assets/logo.png tidak ditemukan"
            exit 1
          }

          python3 -m pip install --quiet Pillow

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assets/logo.png")
          image = Image.open(source).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              output = Path(
                  f"app/src/main/res/mipmap-{density}/ic_launcher.png"
              )
              resized = image.resize(
                  (size, size), Image.Resampling.LANCZOS
              )
              resized.save(output)

          print("Ikon aplikasi berhasil disiapkan.")
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SebuDollarAnalyzer"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sebudollar.analyzer'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sebudollar.analyzer'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="SEBU DOLLAR ANALYZER"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D4AF37</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#1B1B1B</item>
                  <item name="android:navigationBarColor">#1B1B1B</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/sebudollar/analyzer/MainActivity.java <<'EOF'
          package com.sebudollar.analyzer;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.ValueCallback;
          import android.webkit.PermissionRequest;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setStatusBarColor(
                      Color.rgb(27, 27, 27)
                  );
                  getWindow().setNavigationBarColor(
                      Color.rgb(27, 27, 27)
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  );

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                          WebView view,
                          ValueCallback<Uri[]> callback,
                          FileChooserParams params
                      ) {
                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = callback;

                          try {
                              Intent intent = params.createIntent();
                              startActivityForResult(
                                  intent, FILE_CHOOSER_REQUEST
                              );
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                      }

                      @Override
                      public void onPermissionRequest(
                          PermissionRequest request
                      ) {
                          runOnUiThread(() -> {
                              request.grant(request.getResources());
                          });
                      }
                  });

                  setContentView(webView);

                  if (state != null) {
                      webView.restoreState(state);
                  } else {
                      webView.loadUrl(
                          "https://gubby251-dotcom.github.io/gold-ai-analyzer/"
                      );
                  }
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {
                  super.onActivityResult(
                      requestCode, resultCode, data
                  );

                  if (requestCode == FILE_CHOOSER_REQUEST
                      && fileCallback != null) {

                      Uri[] results = null;

                      if (resultCode == RESULT_OK && data != null) {
                          Uri uri = data.getData();

                          if (uri != null) {
                              results = new Uri[]{uri};
                          } else if (data.getClipData() != null) {
                              int count =
                                  data.getClipData().getItemCount();
                              results = new Uri[count];

                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData()
                                      .getItemAt(i).getUri();
                              }
                          }
                      }

                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (fileCallback != null) {
                      fileCallback.onReceiveValue(null);
                      fileCallback = null;
                  }

                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK berhasil dibuat."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEBU-DOLLAR-ANALYZER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
