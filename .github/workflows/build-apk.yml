name: Build SEBU DOLLAR ANALYZER APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK tidak ditemukan: $ANDROID_HOME"
            exit 1
          fi
          echo "Android SDK ditemukan."
          ls "$ANDROID_HOME"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          if [ -z "${FIREBASE_ANDROID_CONFIG:-}" ]; then
            echo "ERROR: GitHub secret FIREBASE_ANDROID_CONFIG belum diatur."
            exit 1
          fi
          printf '%s' "$FIREBASE_ANDROID_CONFIG" > google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("google-services.json").read_text())
          project_id = config.get("project_info", {}).get("project_id")
          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          ]
          if project_id != "sebu-dollar-analyzer" or "com.sebudollar.analyzer" not in packages:
              raise SystemExit("ERROR: google-services.json tidak cocok dengan project/package aplikasi.")
          print("Konfigurasi Firebase Android tervalidasi.")
          PY

          mkdir -p app/src/main/java/com/sebudollar/analyzer
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          test -f assets/logo.png || {
            echo "ERROR: assets/logo.png tidak ditemukan"
            exit 1
          }

          python3 -m pip install --quiet Pillow

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assets/logo.png")
          image = Image.open(source).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              output = Path(f"app/src/main/res/mipmap-{density}/ic_launcher.png")
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(output)

          print("Ikon aplikasi berhasil disiapkan.")
          PY

          cp google-services.json app/google-services.json

          cat > settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SebuDollarAnalyzer"
          include(":app")
          EOF_SETTINGS

          cat > build.gradle <<'EOF_ROOT'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF_ROOT

          cat > app/build.gradle <<'EOF_APP'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.sebudollar.analyzer'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sebudollar.analyzer'
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName '1.2'
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:34.3.0')
              implementation 'com.google.firebase:firebase-messaging'
          }
          EOF_APP

          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="SEBU DOLLAR ANALYZER"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <service
                      android:name=".AnalyzerMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat > app/src/main/res/values/styles.xml <<'EOF_STYLES'
          <resources>
              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D4AF37</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#1B1B1B</item>
                  <item name="android:navigationBarColor">#1B1B1B</item>
              </style>
          </resources>
          EOF_STYLES

          cat > app/src/main/java/com/sebudollar/analyzer/AnalyzerMessagingService.java <<'EOF_SERVICE'
          package com.sebudollar.analyzer;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class AnalyzerMessagingService extends FirebaseMessagingService {
              private static final String CHANNEL_ID = "sebu_signal_alerts";

              @Override
              public void onMessageReceived(RemoteMessage message) {
                  String title = "SEBU DOLLAR ANALYZER";
                  String body = "Signal SEBU DOLLAR";

                  if (message.getNotification() != null) {
                      if (message.getNotification().getTitle() != null) {
                          title = message.getNotification().getTitle();
                      }
                      if (message.getNotification().getBody() != null) {
                          body = message.getNotification().getBody();
                      }
                  } else {
                      if (message.getData().get("title") != null) {
                          title = message.getData().get("title");
                      }
                      if (message.getData().get("body") != null) {
                          body = message.getData().get("body");
                      } else if (message.getData().get("message") != null) {
                          body = message.getData().get("message");
                      }
                  }

                  NotificationManager manager =
                      (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (manager == null) return;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Notifikasi Signal SEBU DOLLAR",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.setDescription("Peringatan signal SEBU DOLLAR ANALYZER");
                      manager.createNotificationChannel(channel);
                  }

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pendingIntent = PendingIntent.getActivity(
                      this,
                      1001,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT |
                          (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                              ? PendingIntent.FLAG_IMMUTABLE : 0)
                  );

                  Notification.Builder builder;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      builder = new Notification.Builder(this, CHANNEL_ID);
                  } else {
                      builder = new Notification.Builder(this);
                  }
                  builder.setSmallIcon(R.mipmap.ic_launcher)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new Notification.BigTextStyle().bigText(body))
                      .setContentIntent(pendingIntent)
                      .setAutoCancel(true)
                      .setPriority(Notification.PRIORITY_HIGH);

                  manager.notify((int) (System.currentTimeMillis() & 0x7fffffff), builder.build());
              }
          }
          EOF_SERVICE

          cat > app/src/main/java/com/sebudollar/analyzer/MainActivity.java <<'EOF_MAIN'
          package com.sebudollar.analyzer;

          import android.app.Activity;
          import android.app.Dialog;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.CookieManager;
          import android.os.Message;
          import android.widget.FrameLayout;
          import android.webkit.ValueCallback;
          import android.webkit.PermissionRequest;
          import android.graphics.Color;
          import android.os.Build;
          import android.content.pm.PackageManager;
          import android.util.Log;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setStatusBarColor(
                      Color.rgb(27, 27, 27)
                  );
                  getWindow().setNavigationBarColor(
                      Color.rgb(27, 27, 27)
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  );

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      private Dialog authDialog;
                      private WebView authWebView;

                      @Override
                      public boolean onCreateWindow(
                          WebView view, boolean isDialog, boolean isUserGesture,
                          Message resultMsg
                      ) {
                          runOnUiThread(() -> {
                              if (authDialog != null && authDialog.isShowing()) {
                                  authDialog.dismiss();
                              }
                              authWebView = new WebView(MainActivity.this);
                              WebSettings popupSettings = authWebView.getSettings();
                              popupSettings.setJavaScriptEnabled(true);
                              popupSettings.setDomStorageEnabled(true);
                              popupSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                              popupSettings.setSupportMultipleWindows(true);
                              CookieManager.getInstance().setAcceptCookie(true);
                              CookieManager.getInstance().setAcceptThirdPartyCookies(authWebView, true);
                              authWebView.setWebViewClient(new WebViewClient());
                              authWebView.setWebChromeClient(new WebChromeClient() {
                                  @Override
                                  public void onCloseWindow(WebView window) {
                                      if (authDialog != null) authDialog.dismiss();
                                      authWebView = null;
                                      authDialog = null;
                                  }
                              });
                              authDialog = new Dialog(MainActivity.this);
                              authDialog.setContentView(authWebView);
                              authDialog.getWindow().setLayout(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.MATCH_PARENT
                              );
                              authDialog.setOnDismissListener(d -> {
                                  if (authWebView != null) {
                                      authWebView.destroy();
                                      authWebView = null;
                                  }
                                  authDialog = null;
                              });
                              authDialog.show();
                              authDialog.getWindow().setLayout(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.MATCH_PARENT
                              );
                              WebView.WebViewTransport transport =
                                  (WebView.WebViewTransport) resultMsg.obj;
                              transport.setWebView(authWebView);
                              resultMsg.sendToTarget();
                          });
                          return true;
                      }

                      @Override
                      public boolean onShowFileChooser(
                          WebView view,
                          ValueCallback<Uri[]> callback,
                          FileChooserParams params
                      ) {
                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = callback;

                          try {
                              Intent intent = params.createIntent();
                              startActivityForResult(
                                  intent, FILE_CHOOSER_REQUEST
                              );
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                      }

                      @Override
                      public void onPermissionRequest(
                          PermissionRequest request
                      ) {
                          runOnUiThread(() -> {
                              request.grant(request.getResources());
                          });
                      }
                  });

                  setContentView(webView);

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 2001
                      );
                  }

                  FirebaseMessaging.getInstance().subscribeToTopic("snr_snd_alerts")
                      .addOnCompleteListener(task -> {
                          if (task.isSuccessful()) {
                              Log.i("SebuDollarFCM", "Berhasil berlangganan topik snr_snd_alerts");
                          } else {
                              Log.e("SebuDollarFCM", "Gagal berlangganan topik snr_snd_alerts", task.getException());
                          }
                      });

                  if (state != null) {
                      webView.restoreState(state);
                  } else {
                      webView.loadUrl(
                          "https://gubby251-dotcom.github.io/gold-ai-analyzer/"
                      );
                  }
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {
                  super.onActivityResult(
                      requestCode, resultCode, data
                  );

                  if (requestCode == FILE_CHOOSER_REQUEST
                      && fileCallback != null) {

                      Uri[] results = null;

                      if (resultCode == RESULT_OK && data != null) {
                          Uri uri = data.getData();

                          if (uri != null) {
                              results = new Uri[]{uri};
                          } else if (data.getClipData() != null) {
                              int count =
                                  data.getClipData().getItemCount();
                              results = new Uri[count];

                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData()
                                      .getItemAt(i).getUri();
                              }
                          }
                      }

                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (fileCallback != null) {
                      fileCallback.onReceiveValue(null);
                      fileCallback = null;
                  }

                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF_MAIN

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK berhasil dibuat."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEBU-DOLLAR-ANALYZER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
